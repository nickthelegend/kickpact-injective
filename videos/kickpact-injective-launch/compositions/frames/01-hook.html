    #root {
      position: absolute;
      inset: 0;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      container-type: size;
      font-family: "KickpactPixel", monospace;
      color: #8aa0f5;
      --paper: #10162e;
      --paper2: #1b2548;
      --ink: #627eea;
      --ink-bright: #8aa0f5;
      --grid: rgba(98, 126, 234, 0.11);
    }

    /* full-bleed navy ground — the dependable base layer (NOT on #root) */
    #root .hk-ground {
      position: absolute;
      inset: 0;
      background: #10162e;
    }
    /* permanent periwinkle graph-paper grid */
    #root .hk-grid {
      position: absolute;
      inset: -2%;
      background-image:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-size: 2.1cqw 2.1cqw;
      transform-origin: 50% 42%;
    }
    #root .hk-gridglow {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 60% 34% at 50% 41%, rgba(98, 126, 234, 0.20) 0%, transparent 66%);
    }
    #root .hk-vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 76% 76% at 50% 42%, transparent 46%, rgba(4, 7, 20, 0.74) 100%);
    }

    /* top / bottom cobalt hairlines that draw in */
    #root .hk-hairline {
      position: absolute;
      left: 4cqw;
      right: 4cqw;
      height: 2px;
      background: var(--ink);
      box-shadow: 0 0 10px rgba(98, 126, 234, 0.4);
    }
    #root .hk-hairline.top { top: 8.5cqh; transform-origin: 0% 50%; }
    #root .hk-hairline.bot { top: 82.6cqh; transform-origin: 100% 50%; }

    /* mono kicker */
    #root .hk-kicker {
      position: absolute;
      left: 0;
      right: 0;
      top: 29.5cqh;
      text-align: center;
      font-size: 1.4cqw;
      letter-spacing: 0.34em;
      color: var(--ink-bright);
      text-transform: uppercase;
    }
    #root .hk-kicker .mk { color: var(--ink); margin-right: 4px; }

    /* converging pixel-glitch cells behind the wordmark */
    #root .hk-cellfield { position: absolute; inset: 0; }
    #root .hk-gcell {
      position: absolute;
      width: 10px;
      height: 10px;
      background: rgba(98, 126, 234, 0.55);
    }

    /* KICKPACT wordmark — glitch-stack (base + two periwinkle ghosts) */
    #root .hk-wordmark {
      position: absolute;
      left: 0;
      right: 0;
      top: 33.3cqh;
      text-align: center;
    }
    #root .hk-wmstack {
      display: inline-grid;
      transform-origin: 50% 50%;
    }
    #root .hk-wmline {
      grid-area: 1 / 1;
      font-size: 10.5cqw;
      line-height: 1;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }
    #root .hk-wmbase {
      z-index: 2;
      color: var(--ink-bright);
      text-shadow:
        0 0 26px rgba(98, 126, 234, 0.55),
        0 0 60px rgba(98, 126, 234, 0.30);
    }
    #root .hk-wmghost {
      z-index: 1;
      opacity: 0;
      mix-blend-mode: screen;
      will-change: transform;
    }
    #root .hk-wmghost.g1 { color: var(--ink); }
    #root .hk-wmghost.g2 { color: var(--ink-bright); }

    /* periwinkle underline that sweeps L->R */
    #root .hk-underline {
      position: absolute;
      left: 24cqw;
      right: 24cqw;
      top: 57.4cqh;
      height: 4px;
      background: linear-gradient(90deg, rgba(98, 126, 234, 0), var(--ink) 18%, var(--ink) 82%, rgba(98, 126, 234, 0));
      box-shadow: 0 0 20px 2px rgba(98, 126, 234, 0.5);
      transform-origin: 0% 50%;
    }

    /* keyword MONEY — the accent block (navy on periwinkle) */
    #root .hk-moneytag {
      position: absolute;
      left: 0;
      right: 0;
      top: 63cqh;
      text-align: center;
    }
    #root .hk-moneywrap {
      position: relative;
      display: inline-block;
    }
    #root .hk-moneyfill {
      position: absolute;
      inset: 0;
      background: var(--ink);
      box-shadow: 0 0 26px rgba(98, 126, 234, 0.45);
      transform-origin: 0% 50%;
      z-index: 1;
    }
    #root .hk-moneyword {
      position: relative;
      z-index: 2;
      display: inline-block;
      padding: 0.7cqh 1.9cqw 1.0cqh;
      font-size: 4.4cqw;
      line-height: 1;
      letter-spacing: 0.05em;
      color: var(--paper);
    }

      tl.fromTo("#hk-gridglow", { opacity: 0 }, { opacity: 1, duration: 1.0, ease: "power2.out" }, 0.1);
      tl.fromTo("#hk-vignette", { opacity: 0.35 }, { opacity: 1, duration: 0.6, ease: "power1.out" }, 0);

      // top/bottom hairlines draw in (top L->R, bottom R->L)
      tl.fromTo("#hk-hl-top", { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "power2.out" }, 0.15);
      tl.fromTo("#hk-hl-bot", { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "power2.out" }, 0.2);

      // mono kicker
      tl.fromTo("#hk-kicker", { opacity: 0, y: -16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.3);

      // pixel cells converge, then (disjoint in time) dissolve as the wordmark snaps into their place
      tl.fromTo(".gc", { opacity: 0, scale: 0.4 }, { opacity: 0.6, scale: 1, duration: 0.38, stagger: 0.008, ease: "power2.out" }, 0.2);
      tl.to(".gc", { opacity: 0, scale: 0.5, duration: 0.4, stagger: 0.006, ease: "power2.in" }, 0.86);

      // KICKPACT snaps in center — glitch-stretch entrance
      tl.fromTo("#hk-wmstack", { scaleX: 1.26 }, { scaleX: 1, duration: 0.32, ease: "power4.out" }, 0.45);
      tl.fromTo("#hk-wmbase", { opacity: 0 }, { opacity: 1, duration: 0.22, ease: "power2.out" }, 0.45);

      // ...with a one-frame pixel-glitch: monochrome (periwinkle) RGB-split, quantized + deterministic, snaps clean
      var ghosts = gsap.utils.toArray("#hk-wmstack .hk-wmghost");
      var amp = { a: 0 };
      var gHash = function (n) {
        var x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
        return x - Math.floor(x);

      var GS = 0.45, GD = 0.26, JIT = 1 / 24, MS = 15;
      tl.set(amp, { a: 1 }, GS);
      tl.set(ghosts, { opacity: 0.55 }, GS);
      tl.to(
        amp,
        {
          a: 0,
          duration: GD,
          ease: "power3.in",
          onUpdate: function () {
            var step = Math.floor(tl.time() / JIT);
            for (var l = 0; l < ghosts.length; l++) {
              var jx = (gHash(step * 13 + l * 7) * 2 - 1) * MS * amp.a;
              var jy = (gHash(step * 29 + l * 11) * 2 - 1) * MS * 0.35 * amp.a;
              gsap.set(ghosts[l], { x: jx, y: jy });
            }
          },
        },
        GS
      );
      // clamp ghosts to exact rest — never rely on the decay landing on zero
      tl.set(ghosts, { x: 0, y: 0, opacity: 0 }, GS + GD);

      // periwinkle underline sweeps L->R
      tl.fromTo("#hk-underline", { scaleX: 0, opacity: 0.4 }, { scaleX: 1, opacity: 1, duration: 0.5, ease: "power2.out" }, 0.98);

      // keyword MONEY lands last in the accent block — highlight wipes, then the word stamps on
      tl.fromTo("#hk-moneyfill", { scaleX: 0 }, { scaleX: 1, duration: 0.34, ease: "power3.out" }, 3.0);
      tl.fromTo("#hk-moneyword", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.32, ease: "back.out(1.7)" }, 3.5);

      window.__timelines["01-hook"] = tl;
    })();
