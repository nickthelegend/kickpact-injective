  <script>
    (function () {
      // ── deterministic pixel mosaics (no random / no date) ──
      function paint(id, rows, cell, on, off) {
        var el = document.getElementById(id);
        if (!el) return;
        el.style.gridTemplateColumns = "repeat(" + rows[0].length + ", " + cell + "px)";
        el.style.gridAutoRows = cell + "px";
        for (var r = 0; r < rows.length; r++) {
          for (var c = 0; c < rows[r].length; c++) {
            var d = document.createElement("div");
            d.style.background = rows[r].charAt(c) === "1" ? on : off;
            el.appendChild(d);
          }
        }
      }

      var INK = "#627eea", SOFT = "#8aa0f5";
      var OFFA = "rgba(98,126,234,0.10)", OFFQ = "rgba(98,126,234,0.16)";

      // person silhouette (both friends)
      var person = ["001100", "011110", "011110", "001100", "011110", "111111"];
      paint("m3-avA-tex", person, 13, SOFT, OFFA);
      paint("m3-avB-tex", person, 13, SOFT, OFFA);

      // padlock / vault motif
      var lock = ["0011100", "0100010", "0100010", "1111111", "1101011", "1100011", "1111111"];
      paint("m3-lock-tex", lock, 16, INK, OFFA);

      // oracle eye / signal motif
      var eye = ["000000", "011110", "100001", "101101", "100001", "011110"];
      paint("m3-oracle-tex", eye, 15, SOFT, OFFA);

      // decorative QR patch
      var qr = ["111011", "100101", "101110", "011001", "110101", "101011"];
      paint("m3-qr", qr, 10, INK, OFFQ);

      // ── one paused, seek-safe timeline ──
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      var DUR = 12.16;

      // ground + chrome establish
      tl.fromTo("#m3-grid", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 0.0);
      tl.fromTo(".m3-hl-top", { scaleX: 0 }, { scaleX: 1, duration: 0.55, ease: "power3.out" }, 0.15);
      tl.fromTo(".m3-hl-bot", { scaleX: 0 }, { scaleX: 1, duration: 0.55, ease: "power3.out" }, 0.2);
      tl.fromTo(".m3-eyebrow", { opacity: 0, y: -6 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 0.25);
      tl.fromTo(".m3-pagenum", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 0.35);
      tl.fromTo("#m3-qr", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.4, ease: "power2.out" }, 0.5);

      // stage 1 — two friends tick in from the left
      tl.fromTo(".m3-avA", { opacity: 0, scale: 0.86, x: -16 }, { opacity: 1, scale: 1, x: 0, duration: 0.44, ease: "power3.out" }, 0.3);
      tl.fromTo(".m3-avB", { opacity: 0, scale: 0.86, x: -16 }, { opacity: 1, scale: 1, x: 0, duration: 0.44, ease: "power3.out" }, 0.55);
      tl.fromTo(".m3-labA", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.34, ease: "power2.out" }, 0.75);
      tl.fromTo(".m3-labB", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.34, ease: "power2.out" }, 0.9);

      // stage 2 — equal stakes tick in
      tl.fromTo(".m3-chipA", { opacity: 0, y: -12, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.36, ease: "back.out(2)" }, 1.3);
