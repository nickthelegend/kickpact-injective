<script>
  (function () {
    window.__timelines = window.__timelines || {};
    var tl = gsap.timeline({ paused: true });
    var DURATION = 5.76;

    // ---- build QR mosaic deterministically (hand-authored 8x8) ----
    var QR = "1110101110001001101011101000101011101101000001001110011110110101";
    var qr = document.getElementById("pl-qr");
    if (qr) {
      for (var c = 0; c < 64; c++) {
        var cell = document.createElement("i");
        if (QR.charAt(c) === "1") cell.className = "on";
        qr.appendChild(cell);
      }
    }

    // ---- prime SVG draw paths (measured, hidden until drawn) ----
    document.querySelectorAll("#pl-callout .pl-draw").forEach(function (p) {
      var len = p.getTotalLength() * 1.02;
      p.style.strokeDasharray = len;
      p.style.strokeDashoffset = len;

    // ---- continuous parallax : phone drifts, screen ken-burns, grid counters ----

      { x: 5, y: -10, duration: DURATION, ease: "sine.inOut" }, 0);
    tl.fromTo("#pl-screen", { scale: 1 },
      { scale: 1.03, duration: DURATION, ease: "sine.inOut" }, 0);
    tl.fromTo("#pl-grid", { y: 0 },
      { y: 10, duration: DURATION, ease: "sine.inOut" }, 0);

    // ---- Scene 1 (0.0-~0.8s) : ground furniture rises + phone enters, right-weighted ----

      { scaleX: 1, duration: 0.5, ease: "power3.out" }, 0.10);
    tl.fromTo("#pl-meta", { opacity: 0, y: -8 },
      { opacity: 0.72, y: 0, duration: 0.45, ease: "power2.out" }, 0.15);
    tl.fromTo(["#pl-fig", "#pl-page", "#pl-hair-bot"], { opacity: 0 },
      { opacity: function (i) { return i === 2 ? 0.4 : 0.55; }, duration: 0.5, ease: "power2.out" }, 0.20);
    tl.fromTo("#pl-qr i.on", { opacity: 0 },
      { opacity: 1, duration: 0.2, stagger: 0.012, ease: "none" }, 0.25);
    tl.fromTo("#pl-vstack", { opacity: 0, y: 24 },
      { opacity: 0.42, y: 0, duration: 0.6, ease: "power2.out" }, 0.30);

    // hero phone : rise + settle (power ease, no spring)

      { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" }, 0.05);

    // feature tag

      { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 0.22);

    // ---- Scene 2 (~0.85s) : first headline line ----
    tl.fromTo("#pl-hl1", { opacity: 0, y: 28 },
      { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.85);

    // ---- Scene 3 (~1.9-3.4s) : callout hairline draws from the headline across to STAKE/PICK/CREATE ----

      { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 1.90);
    tl.fromTo("#pl-origin", { opacity: 0 },
      { opacity: 1, duration: 0.25, ease: "power1.out" }, 1.98);
    tl.to("#pl-lead", { strokeDashoffset: 0, duration: 0.95, ease: "power2.out" }, 2.10);
    tl.to(".pl-brk", { strokeDashoffset: 0, duration: 0.28, stagger: 0.07, ease: "power2.out" }, 2.95);

    // ---- Scene 4 (~3.85s) : second headline line ----
    tl.fromTo("#pl-hl2", { opacity: 0, y: 28 },
      { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 3.85);

    // ---- Scene 5 (~4.72s) : keyword "override" flares on the VO word ----
    tl.fromTo("#pl-kw", { scale: 1, textShadow: "0 0 0px rgba(232,184,75,0)" },
      { scale: 1.08, textShadow: "0 0 26px rgba(232,184,75,0.65)", duration: 0.26, ease: "power2.out" }, 4.72);
    tl.fromTo("#pl-kw", { scale: 1.08, textShadow: "0 0 26px rgba(232,184,75,0.65)" },
      { scale: 1, textShadow: "0 0 9px rgba(232,184,75,0.24)", duration: 0.72, ease: "power2.inOut" }, 4.98);

    // full-span anchor so the sub-comp timeline spans the whole frame
    tl.to({}, { duration: DURATION }, 0);

    window.__timelines["04-pools"] = tl;
  })();
</script>
